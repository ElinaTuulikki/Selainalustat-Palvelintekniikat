<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tappara - Liiga 2025-2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 id="page-title">Tappara - kausi 2025-2026</h1>
        <label for="team-select">Valitse joukkue:</label>
        <select id="team-select"></select>
    </header>

    <main>
        <section>
            <h2>Kaaviot</h2>
            <div class="chart-grid">
                <div class="chart-box"><canvas id="results-chart" role="img" aria-label="Pylväskaavio: joukkueen kotivoitot, vierasvoitot ja tappiot"></canvas></div>
                <div class="chart-box"><canvas id="goals-chart" role="img" aria-label="Pylväskaavio: joukkueen tehdyt ja päästetyt maalit per ottelu"></canvas></div>
                <div class="chart-box"><canvas id="home-away-chart" role="img" aria-label="Piirakkakaavio: kotivoitot ja vierasvoitot koko Liigassa"></canvas></div>
                <div class="chart-box"><canvas id="trend-chart" role="img" aria-label="Viivakaavio: joukkueen yleisömäärä kotiotteluissa kauden aikana"></canvas></div>
                <div class="chart-box tall"><canvas id="average-chart" role="img" aria-label="Vaakapylväskaavio: keskimääräinen yleisömäärä kotiotteluissa joukkueittain"></canvas></div>
            </div>
        </section>

        <div class="table-grid">
            <section class="table-box wide">
                <h2>Joukkueen yhteenveto</h2>
                <table id="summary-table"></table>
            </section>

            <section class="table-box">
                <h2>Kotivoitot vs. vierasvoitot (koko Liiga)</h2>
                <table id="home-away-table"></table>
            </section>

            <section class="table-box">
                <h2>Keskimääräinen yleisömäärä kotiotteluissa</h2>
                <table id="average-table"></table>
            </section>

            <section class="table-box">
                <h2>Suurimmat yleisömäärät</h2>
                <table id="crowds-table"></table>
            </section>
        </div>
    </main>

    <script src="/vendor/chart.js/chart.umd.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
